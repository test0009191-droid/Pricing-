<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Finder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#17201d;--mut:#66726d;--ac:#0b6b57;--acx:#fff;--bd:#d9e0dd;--bad:#b42318;--ok:#e7f4ef}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2220;--tx:#e6ece9;--mut:#93a19b;--ac:#3dd1ad;--acx:#07241c;--bd:#2c3935;--bad:#ff8a7a;--ok:#15302a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1020px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:21px;margin:0}
#count{color:var(--mut);font-size:13px}
button,label.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button.main{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:14px 0 10px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
textarea{width:100%;height:150px;font:13px ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:10px 0}
input[type=number]{width:70px;font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.sum{color:var(--mut);font-size:13px}
.tw{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
td.d{white-space:normal;min-width:200px}
th{color:var(--mut);font-weight:600}
.n{text-align:right;font-variant-numeric:tabular-nums}
tr.miss td{color:var(--bad)}
.tick{color:var(--ac);font-weight:700}
.cf{border:1px solid var(--bad);border-radius:8px;padding:8px 10px;margin:8px 0}.cf label{display:inline-block;margin:6px 16px 0 0}
.sec{display:none}.sec.on{display:block}
</style></head><body><div class="wrap">
<header>
 <div><h1>Price Finder</h1><span id="count"></span></div>
 <div class="row" style="margin:0">
  <label class="btn">Import Excel<input id="imp" type="file" accept=".xlsx,.xls,.csv" hidden></label>
  <button class="main" id="dl">Download Excel</button>
 </div>
</header>
<div class="card row" style="margin:12px 0 0">
 <label><b>Account</b> <select id="acc" style="font:inherit;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:170px"></select></label>
 <button id="newacc">New account</button><button id="delacc">Delete account</button>
</div>
<div class="tabs"><button id="b1" class="on">1. Find prices</button><button id="b2">2. Add prices</button></div>

<div id="t1" class="sec on card">
 <div>Paste item codes, one per line</div>
 <textarea id="codes" placeholder="08021500459&#10;08021500460"></textarea>
 <div class="row">
  <label><input type="checkbox" id="showd" checked> Show with and without discount</label>
  <label><input type="checkbox" id="dedupe"> Remove repeated codes</label>
  <button id="copy">Copy table</button>
  <button id="pdf" class="main">Download PDF</button>
  <span class="sum" id="s1"></span>
 </div>
 <div class="tw"><table id="r1"></table></div>
</div>

<div id="t2" class="sec card">
 <div>Paste invoice lines (code, description, packing, qty, unit, price)</div>
 <textarea id="inv" placeholder="Paste lines copied from the invoice"></textarea>
 <div class="row">
  <label><b>Does this account already have discount pricing?</b> <input type="checkbox" id="don"> Yes</label>
  <label id="dpl">How much <input type="number" id="dp" value="7" min="0" max="99" step="0.1"> %</label>
  <span class="sum" id="dh"></span>
 </div>
 <div id="cf"></div>
 <div class="row"><button class="main" id="add">Add to list</button><span class="sum" id="s2"></span></div>
 <div class="tw"><table id="r2"></table></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*10000)/10000).toFixed(4);
const key=c=>String(c).trim().replace(/^0+/,'');
let accts={},cur='',store={},meta={},out=[],parsed=[];
try{meta=JSON.parse(localStorage.getItem('pfm')||'{}')}catch(e){}
function saveMeta(){try{localStorage.setItem('pfm',JSON.stringify(meta))}catch(e){}}
function syncDisc(){const on=$('don').checked;$('dpl').style.display=on?'':'none';$('dh').textContent=on?'Prices you paste already include this discount.':'Prices you paste are kept as they are.'}
try{accts=JSON.parse(localStorage.getItem('pf2')||'{}')}catch(e){}
if(!Object.keys(accts).length){try{const o=JSON.parse(localStorage.getItem('pf')||'{}');if(Object.keys(o).length)accts.Default=o}catch(e){}}
function pick(n){cur=n;store=n?(accts[n]=accts[n]||{}):{};const m=meta[n];$('don').checked=!!(m&&m.on);$('dp').value=m&&m.pct?m.pct:7;syncDisc()}
function save(){try{localStorage.setItem('pf2',JSON.stringify(accts))}catch(e){}draw()}
function draw(){
 const ns=Object.keys(accts);if(!ns.includes(cur))pick(ns[0]||'');
 $('acc').innerHTML=ns.length?ns.map(n=>`<option${n===cur?' selected':''}>${esc(n)}</option>`).join(''):'<option>No account yet</option>';
 $('count').textContent=ns.length?Object.keys(store).length+' items in this account, '+ns.length+' accounts':'Create an account to start';
}
$('acc').onchange=()=>{const v=$('acc').value;if(!accts[v])return;pick(v);draw();parse();find()};
$('newacc').onclick=()=>{const n=(prompt('Account number or name')||'').trim();if(!n)return;if(!accts[n])accts[n]={};pick(n);save();find()};
$('delacc').onclick=()=>{if(cur&&confirm('Delete account '+cur+' and all its prices?')){delete accts[cur];pick('');save();find()}};
function before(a,d){return d>0?a/(1-d/100):a}

/* tabs */
['1','2'].forEach(n=>$('b'+n).onclick=()=>{
 ['1','2'].forEach(m=>{$('b'+m).classList.toggle('on',m==n);$('t'+m).classList.toggle('on',m==n)})});

/* tab 1: find */
function find(){
 let c=$('codes').value.split(/\r?\n/).map(l=>l.trim().split(/[\s,]+/)[0]).filter(Boolean);
 if($('dedupe').checked)c=[...new Set(c)];
 const sd=$('showd').checked;let ok=0,miss=0,h='';out=[];
 c.forEach(x=>{const r=store[key(x)];
  if(r){ok++;out.push(r);
   h+=`<tr><td>${esc(r.code)}</td><td class=d>${esc(r.desc)}</td><td>${esc(r.pack)}</td>`+
   (sd?`<td class=n>${r.disc>0?fmt(r.before):''}</td><td class=n>${fmt(r.after)}</td><td>${r.disc>0?'<span class=tick>✓</span> '+r.disc+'%':''}</td>`:`<td class=n>${fmt(r.after)}</td>`)+'</tr>';
  }else{miss++;out.push({code:x,desc:'NOT FOUND',pack:'',before:'',after:'',disc:''});
   h+=`<tr class=miss><td>${esc(x)}</td><td class=d>Not found</td><td></td><td></td>${sd?'<td></td><td></td>':''}</tr>`}});
 $('r1').innerHTML=c.length?'<tr><th>Code<th>Description<th>Packing'+(sd?'<th class=n>Without discount<th class=n>With discount<th>Discount':'<th class=n>Price')+'</tr>'+h:'';
 $('s1').textContent=c.length?ok+' found'+(miss?', '+miss+' not found':''):'';
}
['codes','showd','dedupe'].forEach(i=>$(i).addEventListener('input',find));
$('copy').onclick=()=>{
 const sd=$('showd').checked;
 const t=out.map(r=>[r.code,r.desc,r.pack].concat(sd?[r.disc>0?fmt(r.before):'',r.after===''?'':fmt(r.after),r.disc>0?r.disc+'%':'']:[r.after===''?'':fmt(r.after)]).join('\t')).join('\n');
 const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
 try{navigator.clipboard&&navigator.clipboard.writeText(t)}catch(e){}
 try{document.execCommand('copy')}catch(e){}a.remove();$('s1').textContent='Copied';
};

$('pdf').onclick=()=>{
 if(!out.length){$('s1').textContent='Nothing to download yet';return}
 if(!window.jspdf){alert('The PDF tool did not load. Check your internet connection and reload the page.');return}
 const sd=$('showd').checked,doc=new window.jspdf.jsPDF({orientation:'landscape'});
 doc.setFontSize(15);doc.text('Price List',14,14);
 doc.setFontSize(10);doc.text('Account: '+(cur||'-')+'     Date: '+new Date().toLocaleDateString('en-GB'),14,20);
 const head=[['Code','Description','Packing'].concat(sd?['Without discount','With discount','Discount']:['Price'])];
 const body=out.map(r=>[r.code,r.desc,r.pack].concat(sd?[r.disc>0?fmt(r.before):'',r.after===''?'':fmt(r.after),r.disc>0?r.disc+'%':'']:[r.after===''?'':fmt(r.after)]));
 const right={};for(let i=3;i<(sd?5:4);i++)right[i]={halign:'right'};
 doc.autoTable({head,body,startY:25,styles:{fontSize:9},headStyles:{fillColor:[11,107,87]},columnStyles:right,
  didParseCell:h=>{if(h.section==='body'&&h.row.raw[1]==='NOT FOUND')h.cell.styles.textColor=[180,35,24]}});
 doc.save('prices-'+String(cur||'list').replace(/[^\w-]+/g,'_')+'.pdf');
};

/* tab 2: add */
let choice={},groups=[],skip=0,unres=0;
function parse(){
 syncDisc();const d=$('don').checked?(parseFloat($('dp').value)||0):0;skip=0;
 const idx={};groups=[];
 $('inv').value.split(/\r?\n/).forEach(l=>{
  l=l.trim();if(!l)return;
  let p=l.split('\t').map(s=>s.trim()).filter(Boolean);
  if(p.length<4)p=l.split(/\s{2,}/);
  const code=p[0],after=parseFloat(String(p[p.length-1]).replace(/,/g,''));
  if(!/^[A-Za-z0-9-]+$/.test(code)||isNaN(after)||p.length<3){skip++;return}
  const r={code,desc:p[1]||'',pack:p[2]||'',unit:p.length>=5?p[p.length-2]:'',q:p.length>=5?p[p.length-3]:'',after,disc:d,before:before(after,d)};
  const k=key(code);
  if(idx[k]===undefined){idx[k]=groups.length;groups.push({k,opts:[r]})}
  else{const g=groups[idx[k]];if(!g.opts.find(x=>fmt(x.after)===fmt(r.after)))g.opts.push(r)}
 });
 $('cf').innerHTML=groups.filter(g=>g.opts.length>1).map(g=>{
  const f=g.opts[0];
  return `<div class="cf"><b>${esc(f.code)}</b> ${esc(f.desc)}<br><span class="sum">This code has different prices. Which one should be saved?</span><br>`+
  g.opts.map(o=>`<label><input type="radio" name="c${esc(g.k)}" data-k="${esc(g.k)}" value="${fmt(o.after)}"${choice[g.k]===fmt(o.after)?' checked':''}> ${fmt(o.after)}${o.q?' (qty '+esc(o.q)+')':''}</label>`).join('')+'</div>'}).join('');
 render();
}
function render(){
 unres=0;parsed=[];
 groups.forEach(g=>{
  if(g.opts.length==1){parsed.push(g.opts[0]);return}
  const o=g.opts.find(x=>fmt(x.after)===choice[g.k]);
  if(o)parsed.push(o);else unres++;
 });
 $('r2').innerHTML=parsed.length?'<tr><th>Code<th>Description<th>Packing<th class=n>Without discount<th class=n>With discount</tr>'+
  parsed.map(r=>`<tr><td>${esc(r.code)}</td><td class=d>${esc(r.desc)}</td><td>${esc(r.pack)}</td><td class=n>${r.disc>0?fmt(r.before):''}</td><td class=n>${fmt(r.after)}</td></tr>`).join(''):'';
 const m=[];
 if(parsed.length)m.push(parsed.length+' items ready');
 if(unres)m.push('choose a price for '+unres+' repeated code'+(unres>1?'s':''));
 if(skip)m.push(skip+' lines could not be read');
 $('s2').textContent=m.join(', ');
}
$('cf').addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.k){choice[t.dataset.k]=t.value;render()}});
['inv','don','dp'].forEach(i=>$(i).addEventListener('input',parse));
$('add').onclick=()=>{
 if(!cur){$('s2').textContent='Create or select an account first';return}
 if(unres){$('s2').textContent='Choose a price for the '+unres+' repeated code'+(unres>1?'s':'')+' first';return}
 if(!parsed.length){$('s2').textContent='Nothing to add yet';return}
 parsed.forEach(r=>{const c={...r};delete c.q;store[key(r.code)]=c});meta[cur]={on:$('don').checked,pct:parseFloat($('dp').value)||0};saveMeta();save();
 $('s2').textContent=parsed.length+' items added. Total '+Object.keys(store).length;
 $('inv').value='';parsed=[];groups=[];choice={};$('cf').innerHTML='';$('r2').innerHTML='';find();
};

/* excel */
$('dl').onclick=()=>{
 const rows=Object.keys(accts).flatMap(a=>Object.values(accts[a]).map(r=>({'Account':a,'Code':r.code,'Description':r.desc,'Packing':r.pack,'Unit':r.unit||'','Price After':r.after,'Discount %':r.disc,'Price Before':+fmt(r.before)})));
 if(!rows.length){alert('Nothing to download yet.');return}
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Prices');
 XLSX.writeFile(wb,'price-list.xlsx');
};
$('imp').onchange=e=>{
 const f=e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{
  try{
   const wb=XLSX.read(fr.result,{type:'array'});
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let n=0;
   rows.forEach(o=>{
    const m={};Object.keys(o).forEach(k=>m[k.toLowerCase().replace(/[^a-z]/g,'')]=o[k]);
    const v=Object.values(o),o1=m.account!==undefined?1:0;
    const an=String(m.account||'').trim()||cur||'Default';
    const code=String(m.code!==undefined?m.code:v[o1]).trim();if(!code)return;
    const after=parseFloat(m.priceafter!==undefined?m.priceafter:v[o1+4]);if(isNaN(after))return;
    const disc=parseFloat(m.discount!==undefined?m.discount:v[o1+5])||0;
    const A=accts[an]=accts[an]||{};if(disc>0||!meta[an])meta[an]={on:disc>0,pct:disc>0?disc:7};
    A[key(code)]={code,desc:String(m.description!==undefined?m.description:v[o1+1]),pack:String(m.packing!==undefined?m.packing:v[o1+2]),unit:String(m.unit!==undefined?m.unit:v[o1+3]),after,disc,before:before(after,disc)};n++;
   });
   saveMeta();save();pick(cur);parse();find();alert(n+' items imported.');
  }catch(err){alert('Could not read this file.')}
 };
 fr.readAsArrayBuffer(f);e.target.value='';
};
save();
</script></body></html>
